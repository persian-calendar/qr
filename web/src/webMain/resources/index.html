<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>QR Code Generator</title>
	<meta name="description" content="Generate a QR code from text, in the browser, with the persian-calendar/qr library compiled to JavaScript and WebAssembly.">
	<link rel="manifest" href="manifest.webmanifest">
	<meta name="theme-color" content="#0d1117">
	<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
	<link rel="icon" type="image/png" href="icons/icon-192.png">
	<link rel="apple-touch-icon" href="icons/icon-192.png">
	<style>
:root {
	--bg: #0d1117;
	--surface: #161b22;
	--border: #2b323d;
	--text: #e6edf3;
	--muted: #8b949e;
	--accent: #4c9aff;
	--accent-ink: #06101f;
	--ink: #000;
	--paper: #fff;
	color-scheme: dark;
}

* { box-sizing: border-box; }

body {
	margin: 0;
	padding: 1.5rem 1rem 3rem;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 1.25rem;
	min-height: 100vh;
	background:
		radial-gradient(60rem 40rem at 50% -10%, #16233a 0%, transparent 60%),
		var(--bg);
	color: var(--text);
	font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
	-webkit-text-size-adjust: 100%;
}

main {
	width: 100%;
	max-width: 44rem;
	display: flex;
	flex-direction: column;
	gap: 1rem;
}

header { text-align: center; }

h1 {
	margin: 0;
	font-size: clamp(1.5rem, 5vw, 2rem);
	letter-spacing: -.02em;
}

header p {
	margin: .4rem 0 0;
	color: var(--muted);
	font-size: .9rem;
}

.panel {
	display: flex;
	flex-direction: column;
	gap: .75rem;
	padding: 1rem;
	border: 1px solid var(--border);
	border-radius: .9rem;
	background: var(--surface);
}

label {
	display: flex;
	flex-direction: column;
	gap: .3rem;
	font-size: .8rem;
	font-weight: 600;
	color: var(--muted);
}

textarea,
select,
input {
	width: 100%;
	padding: .55rem .65rem;
	border: 1px solid var(--border);
	border-radius: .5rem;
	background: #0d1117;
	color: var(--text);
	font: inherit;
	font-size: .95rem;
}

textarea {
	min-height: 5.5rem;
	resize: vertical;
	font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	font-size: .9rem;
}

textarea:focus-visible,
select:focus-visible,
input:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 1px;
}

.options {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr));
	gap: .75rem;
}

.actions {
	display: flex;
	flex-wrap: wrap;
	gap: .6rem;
}

button {
	flex: 1 1 8rem;
	padding: .6rem 1rem;
	border: 1px solid var(--border);
	border-radius: .5rem;
	background: #21262d;
	color: var(--text);
	font: inherit;
	font-size: .9rem;
	font-weight: 600;
	cursor: pointer;
	transition: background .15s, border-color .15s, opacity .15s;
}

button:hover:not(:disabled) { background: #2b323d; }

button:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 1px;
}

button:disabled {
	opacity: .45;
	cursor: not-allowed;
}

button.primary {
	border-color: transparent;
	background: var(--accent);
	color: var(--accent-ink);
}

button.primary:hover:not(:disabled) { background: #6aabff; }

.output {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: .75rem;
}

/* The code is drawn on a canvas, on a white card with a quiet zone around it, which is
   what a scanner needs: the blank margin is part of the specification. */
.frame {
	display: grid;
	place-items: center;
	padding: 1rem;
	border-radius: .9rem;
	background: var(--paper);
	box-shadow: 0 18px 40px -24px rgba(0, 0, 0, .9);
}

.frame canvas {
	display: block;
	width: min(70vw, 20rem);
	height: auto;
	image-rendering: pixelated;
}

.frame canvas:not([width]) { display: none; }

.status {
	margin: 0;
	min-height: 1.4rem;
	color: var(--muted);
	font-size: .85rem;
	text-align: center;
}

.status.error { color: #ff7b72; }

footer {
	max-width: 44rem;
	margin-top: auto;
	padding-top: 1rem;
	border-top: 1px solid var(--border);
	color: var(--muted);
	font-size: .78rem;
	line-height: 1.9;
	text-align: center;
}

footer a { color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
	button { transition: none; }
}
	</style>
</head>
<body>
	<main>
		<header>
			<h1>QR Code Generator</h1>
			<p>Type or paste some text and get a QR code for it. Nothing leaves your browser.</p>
		</header>

		<div class="panel">
			<label for="text">
				<span>Text</span>
				<textarea id="text" rows="3" spellcheck="false" placeholder="https://example.com">Hello, QR!</textarea>
			</label>

			<div class="options">
				<label for="level">
					<span>Error correction</span>
					<select id="level">
						<option value="L">L — 7%</option>
						<option value="M" selected>M — 15%</option>
						<option value="Q">Q — 25%</option>
						<option value="H">H — 30%</option>
					</select>
				</label>
				<label for="version">
					<span>Version</span>
					<select id="version">
						<option value="0" selected>Auto</option>
					</select>
				</label>
				<label for="scale">
					<span>Module size</span>
					<select id="scale">
						<option value="2">2 px</option>
						<option value="4" selected>4 px</option>
						<option value="8">8 px</option>
						<option value="12">12 px</option>
					</select>
				</label>
			</div>

			<div class="actions">
				<button class="primary" id="download-png" type="button">Download PNG</button>
				<button id="download-svg" type="button">Download SVG</button>
				<button id="copy" type="button">Copy as text</button>
			</div>
		</div>

		<div class="output">
			<div class="frame">
				<canvas id="code" role="img" aria-label="QR code for the text above"></canvas>
			</div>
			<p class="status" id="status" role="status" aria-live="polite">…</p>
		</div>
	</main>

	<footer>
		<p>
			Encoded with <a href="https://github.com/persian-calendar/qr">persian-calendar/qr</a>,
			compiled from Kotlin to JavaScript and to WebAssembly. Pick either bundle from the
			<a href="https://github.com/persian-calendar/qr/tree/main/web">web module</a>.
		</p>
		<p>QR Code is a registered trademark of DENSO WAVE INCORPORATED.</p>
	</footer>

	<script src="main.js"></script>
	<script src="web.js"></script>
	<script>
		/*
		 * Offline support, and a page that does not go stale.
		 *
		 * The worker itself is the version marker: the build stamps a digest of the page into
		 * sw.js, so every deploy gives the browser a sw.js it has not seen, which installs a
		 * new worker, fills a new cache and drops the old one. The browser looks for that on
		 * its own when the page is opened; the timer and the visibility check below are for a
		 * page that is left open, since a countdown can sit in a tab for days.
		 *
		 * When a new worker takes over a page that was already controlled, a new version is
		 * live, so the page reloads once to run it. The first install claims the page too, and
		 * there is nothing to refresh then.
		 *
		 * Not on a development server: a cached bundle there would keep serving stale files
		 * while the page is being worked on.
		 */
		if ('serviceWorker' in navigator &&
			location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
			var hadController = !!navigator.serviceWorker.controller;
			var reloading = false;
			navigator.serviceWorker.addEventListener('controllerchange', function () {
				if (!hadController || reloading) return;
				reloading = true;
				location.reload();
			});

			navigator.serviceWorker.register('sw.js').then(function (registration) {
				function checkForUpdate() {
					registration.update();
				}
				setInterval(checkForUpdate, 60 * 60 * 1000);
				document.addEventListener('visibilitychange', function () {
					if (document.visibilityState === 'visible') checkForUpdate();
				});
			});
		}
	</script>
</body>
</html>
